version: '3.8'

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${DB_USER:-bitrixuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-bitrixbot}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  bot:
    build: .
    command: python -m bitrix_bot
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db-data:
