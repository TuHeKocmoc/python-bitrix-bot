global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'node'
    static_configs:
      - targets: ['172.17.0.1:9100']

  - job_name: 'postgres-bitrix'
    static_configs:
      - targets: ['postgres_exporter_bitrix:9187']

  - job_name: 'postgres-task'
    static_configs:
      - targets: ['postgres_exporter_task:9187']

  - job_name: 'bot-bitrix'
    static_configs:
      - targets: ['bot-bitrix:8000']

  - job_name: 'bot-task'
    static_configs:
      - targets: ['bot-task:8001'] 